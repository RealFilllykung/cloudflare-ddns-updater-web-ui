version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: frontend
    networks:
      - ddns-updater
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=development

  backend:
    build: ./backend
    container_name: backend
    networks:
      - ddns-updater
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=ddns
      - DB_USER=ddnsuser
      - DB_PASSWORD=ddnspassword
    depends_on:
      - database

  database:
    image: postgres:16
    container_name: database
    networks:
      - ddns-updater
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ddns
      - POSTGRES_USER=ddnsuser
      - POSTGRES_PASSWORD=ddnspassword
    volumes:
      - db_data:/var/lib/postgresql/data

networks:
  ddns-updater:
    driver: bridge

volumes:
  db_data:
